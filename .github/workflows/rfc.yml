name: RFC

# Syncs RFC frontmatter from PR labels and regenerates INDEX.md after an RFC
# PR is merged. Runs *after* merge — branch protection gates the merge itself
# on the required labels; this workflow only records the outcome.
#
# Uses `pull_request_target` (not `pull_request`) so that RFC PRs opened from
# forks still get a read-write GITHUB_TOKEN for the post-merge `git push`.
# This is safe here because the job checks out `main` and only runs the repo's
# own committed script + `gh` — it never executes code from the PR branch.

on:
  pull_request_target:
    types: [closed]
    paths:
      - "docs/rfcs/**.md"

permissions:
  contents: write
  pull-requests: read

# Serialize runs so two RFC PRs merged close together can't race the push to
# main (the second run would otherwise rebase or fail). Never cancel: every
# merged RFC must have its status recorded.
concurrency:
  group: rfc-sync
  cancel-in-progress: false

jobs:
  sync:
    # Only for merged (not merely closed) RFC PRs carrying the `rfc` label.
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'rfc')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve status label and changed RFC files
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          set -euo pipefail

          # Exactly one status:* label is required (see docs/rfcs/README.md).
          # Collect every match rather than first-wins, so a stray/duplicate
          # label fails loudly instead of silently stamping the wrong status.
          status=""
          count=0
          for want in accepted rejected deferred withdrawn; do
            if echo "$LABELS" | grep -q "\"status:$want\""; then
              status="$want"
              count=$((count + 1))
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::RFC PR is missing a status:* label" >&2
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::RFC PR has multiple status:* labels; exactly one is required" >&2
            exit 1
          fi

          # Capture the diff first so a `gh` failure (auth/network) fails the
          # step; grep's exit 1 (no match) is the only case `|| true` absorbs.
          files="$(gh pr diff "$PR" --name-only)"
          printf '%s\n' "$files" \
            | grep -E '^docs/rfcs/[0-9]{4}-.*\.md$' > changed.txt || true

          # Prefer the PR's merge timestamp over the runner clock so the recorded
          # date is deterministic and tied to the event (re-runs stay stable).
          date="${MERGED_AT%%T*}"
          if [ -z "$date" ]; then
            date="$(date -u +%Y-%m-%d)"
          fi

          {
            echo "status=$status"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"

          echo "Status: $status"
          echo "Changed RFC files:"
          cat changed.txt

      - name: Sync frontmatter and regenerate index
        env:
          STATUS: ${{ steps.resolve.outputs.status }}
          DATE: ${{ steps.resolve.outputs.date }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -s changed.txt ]; then
            # shellcheck disable=SC2046
            python scripts/rfc.py set-status \
              --status "$STATUS" --pr "$PR" --date "$DATE" \
              $(cat changed.txt)
          fi
          python scripts/rfc.py sync-supersedes --date "$DATE"
          python scripts/rfc.py index

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add docs/rfcs
          git commit -m "chore(rfc): sync status from PR labels [skip ci]"
          # Another RFC PR may have merged since checkout; rebase before pushing
          # so concurrent syncs don't hit a non-fast-forward rejection.
          git pull --rebase origin main
          git push origin main
