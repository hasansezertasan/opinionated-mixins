[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "opinionated-mixins"
dynamic = ["version"]
description = "Opinionated, consensus-driven model mixins — consistent across Python storage frameworks (ORMs & ODMs)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [{ name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []


[project.urls]
Documentation = "https://github.com/hasansezertasan/opinionated-mixins#readme"
Issues = "https://github.com/hasansezertasan/opinionated-mixins/issues"
Source = "https://github.com/hasansezertasan/opinionated-mixins"


[tool.hatch.version]
path = "src/opinionated_mixins/__about__.py"


[dependency-groups]
dev = [
  "coverage[toml]>=7.13.5",
  "pytest==9.0.3",
  "sqlalchemy==2.0.49",
  "mongoengine==0.29.3",
  "odmantic==1.1.0",
  "mongomock>=4.3.0",
  "mongomock-motor>=0.0.32",
  "testcontainers[mongodb]>=4.10.0",
  "pytest-asyncio>=1.3.0",
]
types = [
  "mypy>=1.20.1",
  "ruff==0.15.11",
]


[tool.ruff]
# Run `ruff linter` command to see all available linters and their descriptions
target-version = "py310"
show-fixes = true
fix = true


[tool.ruff.lint]
fixable = ["ALL"]
ignore-init-module-imports = true
select = ["ALL"]
ignore = [
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN001",  # Missing type annotation for function argument (fixtures)
  "ANN202",  # Missing return type for private function (fixtures)
  "D101",    # Missing docstring in public class
  "D102",    # Missing docstring in public method
  "D103",    # Missing docstring in public function
  "DTZ001",  # datetime without tzinfo (test fixtures)
  "DTZ011",  # datetime.date.today() used (test fixtures)
  "PLC0415", # Import not at top-level (intentional in test methods)
  "PLR2004", # Magic value used in comparison (expected in tests)
  "PT018",   # Compound assertion (intentional for clear error messages)
  "RUF012",  # Mutable class attribute without ClassVar (test model meta)
  "S101",    # Use of assert (expected in tests)
  "S105",    # Possible hardcoded password (test fixtures)
  "S106",    # Possible hardcoded password in argument (test fixtures)
]
"examples/**/*.py" = [
  "D101",    # Missing docstring in public class (model definitions)
  "D106",    # Missing docstring in public nested class (Meta)
  "INP001",  # Implicit namespace package (examples aren't packages)
  "PLC0415", # Import not at top-level (conditional imports like mongomock)
  "RUF012",  # Mutable class attribute without ClassVar (model columns)
  "S105",    # Possible hardcoded password (demo data)
  "S106",    # Possible hardcoded password in argument (demo data)
  "T201",    # print() usage (example scripts)
]
"src/opinionated_mixins/contrib/sqlmodel/*.py" = [
  "PLC0414", # Import alias does not rename (intentional re-exports)
]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.isort]
known-third-party = ["opinionated_mixins"]


[tool.mypy]
strict = true
pretty = true
follow_imports = "silent"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "opinionated_mixins.contrib.sqlalchemy.*"
# Declarative mixins use Column() without Mapped[] annotations
disable_error_code = ["var-annotated"]


[tool.coverage.run]
source_pkgs = ["opinionated_mixins", "tests"]
branch = true
parallel = true
omit = ["src/opinionated_mixins/__about__.py"]


[tool.coverage.paths]
opinionated_mixins = [
  "src/opinionated_mixins",
  "*/opinionated-mixins/src/opinionated_mixins",
]
tests = ["tests", "*/opinionated-mixins/tests"]


[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]


[tool.pytest.ini_options]
markers = [
    "mongo: requires real MongoDB via testcontainers (skipped by default)",
]
asyncio_mode = "auto"
