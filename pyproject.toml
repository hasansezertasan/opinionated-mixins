[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "opinionated-mixins"
dynamic = ["version"]
description = "Opinionated, consensus-driven model mixins — consistent across Python ORMs and data frameworks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [{ name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []


[project.urls]
Documentation = "https://github.com/hasansezertasan/opinionated-mixins#readme"
Issues = "https://github.com/hasansezertasan/opinionated-mixins/issues"
Source = "https://github.com/hasansezertasan/opinionated-mixins"


[tool.hatch.version]
path = "src/opinionated_mixins/__about__.py"


[dependency-groups]
dev = [
  "coverage[toml]>=7.13.5",
  "pytest==9.0.3",
  "pydantic>=2.13.2",
  "sqlalchemy==2.0.49",
  "mongoengine==0.29.3",
  "odmantic==1.1.0",
  "beanie==2.1.0",
  "wtforms==3.2.1",
]
types = [
  "mypy>=1.20.1",
  "ruff==0.15.11",
  "sqlalchemy-stubs>=0.4",
  "types-WTForms>=3.1",
]


[tool.ruff]
# Run `ruff linter` command to see all available linters and their descriptions
target-version = "py310"
show-fixes = true
fix = true


[tool.ruff.lint]
fixable = ["ALL"]
ignore-init-module-imports = true
select = ["ALL"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.isort]
known-third-party = ["opinionated_mixins"]


[tool.mypy]
strict = true
pretty = true
follow_imports = "silent"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true


[tool.coverage.run]
source_pkgs = ["opinionated_mixins", "tests"]
branch = true
parallel = true
omit = ["src/opinionated_mixins/__about__.py"]


[tool.coverage.paths]
opinionated_mixins = [
  "src/opinionated_mixins",
  "*/opinionated-mixins/src/opinionated_mixins",
]
tests = ["tests", "*/opinionated-mixins/tests"]


[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
